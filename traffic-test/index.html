<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic test page</title>
<style>
  :root{
    --bar:#18232d;
    --bar-line:#2b3a48;
    --text:#e6edf2;
    --muted:#9db0bf;
    --focus:#8cc3e6;
    --map-bg:#f3efe6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;
    grid-template-rows:auto 1fr;
    background:var(--map-bg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  body.kiosk{grid-template-rows:1fr}
  body.kiosk .bar{display:none}

  /* Control bar (hidden in kiosk mode) */
  .bar{
    background:var(--bar);
    border-bottom:1px solid var(--bar-line);
    padding:10px 14px;
    display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  }
  .bar h1{font-size:15px;font-weight:600;margin:0 6px 0 0}
  .field{display:flex;align-items:center;gap:6px}
  .field label{color:var(--muted)}
  select,input,button{
    font:inherit;color:var(--text);
    background:#22313d;border:1px solid var(--bar-line);
    border-radius:6px;padding:5px 8px;
  }
  input[type=number]{width:72px}
  button{cursor:pointer}
  button:hover{background:#2a3b49}
  select:focus-visible,input:focus-visible,button:focus-visible{
    outline:2px solid var(--focus);outline-offset:2px;
  }
  .zoom-val{min-width:2ch;text-align:center}
  .link{display:flex;align-items:center;gap:6px;flex:1 1 320px;min-width:260px}
  .link input{flex:1;min-width:0}
  .status{color:var(--muted);min-width:9ch}

  /* Map stage */
  .stage{
    display:grid;grid-template-columns:1fr;gap:0;
    min-height:0;height:100%;
  }
  .stage[data-cols="2"]{grid-template-columns:1fr 1fr;gap:2px;background:#101820}
  @media (max-width:700px){
    .stage[data-cols="2"]{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  }
  .pane{position:relative;min-height:0;min-width:0;background:var(--map-bg)}
  .crop{position:absolute;inset:0;overflow:hidden}
  .crop iframe{position:absolute;left:0;border:0}
  .gmap{position:absolute;inset:0}
  .gmap.empty{
    display:grid;place-items:center;text-align:center;padding:24px;
    color:#3a4854;background:var(--map-bg);
  }
  .tag{
    position:absolute;left:10px;bottom:10px;
    background:rgba(24,35,45,.85);color:var(--text);
    padding:3px 9px;border-radius:5px;font-size:13px;
  }
  body.kiosk .tag{display:none}
</style>
</head>
<body>

<header class="bar" id="bar">
  <h1>Traffic test page</h1>
  <div class="field">
    <label for="site">Location</label>
    <select id="site">
      <option value="menlopark">Menlo Park</option>
      <option value="unioncity">Union City</option>
      <option value="dev">Sample / dev</option>
    </select>
  </div>
  <div class="field">
    <label for="map">Map</label>
    <select id="map">
      <option value="waze">Waze</option>
      <option value="google">Google</option>
      <option value="both">Waze and Google</option>
    </select>
  </div>
  <div class="field">
    <label>Zoom</label>
    <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
    <span class="zoom-val" id="zoomVal" aria-live="polite"></span>
    <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
  </div>
  <div class="field">
    <label for="top">Crop top</label>
    <input id="top" type="number" min="0" max="400" step="10">
  </div>
  <div class="field">
    <label for="right">Crop right</label>
    <input id="right" type="number" min="0" max="400" step="10">
  </div>
  <div class="link">
    <input id="tvLink" type="text" readonly aria-label="Link to use on the TV">
    <button type="button" id="copy">Copy TV link</button>
    <span class="status" id="status" role="status"></span>
  </div>
</header>

<main class="stage" id="stage"></main>

<script>
/* ---------------------------------------------------------------
   Settings you may edit
---------------------------------------------------------------- */

// Paste a Google Maps JavaScript API key here to enable the Google map.
// Restrict the key to the website address where this file is hosted.
const GOOGLE_KEY = "AIzaSyAjE-EDZYR8g1vCo_ETLLjk1GQCvPNTE64";

// Approximate city centers. Adjust lat/lon/zoom to frame your own area.
const SITES = {
  menlopark: { name: "Menlo Park",   lat: 37.4530,   lon: -122.1817,   zoom: 12 },
  unioncity: { name: "Union City",   lat: 37.5934,   lon: -122.0439,   zoom: 12 },
  dev:       { name: "Sample / dev", lat: 37.535773, lon: -122.124116, zoom: 11 }
};

/* ---------------------------------------------------------------
   Read settings from the web address
   Example for the TV:
   ?site=menlopark&map=waze&kiosk=1
---------------------------------------------------------------- */
const params = new URLSearchParams(location.search);

function num(name, fallback, min, max) {
  if (!params.has(name)) return fallback;
  const v = Number(params.get(name));
  return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : fallback;
}

const state = {
  site:    SITES[params.get("site")] ? params.get("site") : "dev",
  map:     ["waze", "google", "both"].includes(params.get("map")) ? params.get("map") : "waze",
  zoom:    params.has("zoom") ? num("zoom", null, 3, 18) : null,
  top:     num("top", 130, 0, 400),     // hides the Waze header and search box
  right:   num("right", 0, 0, 400),     // hides Waze zoom buttons if raised
  bottom:  num("bottom", 0, 0, 400),
  refresh: num("refresh", 5, 0, 60),    // minutes between map reloads, 0 = off
  kiosk:   params.get("kiosk") === "1"
};

document.body.classList.toggle("kiosk", state.kiosk);

const stage = document.getElementById("stage");
let timer = null;

/* ---------------------------------------------------------------
   Waze pane
---------------------------------------------------------------- */
function wazeUrl(site, zoom) {
  return "https://embed.waze.com/iframe?zoom=" + zoom +
         "&lat=" + site.lat + "&lon=" + site.lon + "&ct=livemap";
}

function makeTag(text) {
  const el = document.createElement("span");
  el.className = "tag";
  el.textContent = text;
  return el;
}

function wazePane(site, zoom) {
  const pane = document.createElement("section");
  pane.className = "pane";

  const crop = document.createElement("div");
  crop.className = "crop";

  const frame = document.createElement("iframe");
  frame.className = "waze";
  frame.title = "Waze live traffic map for " + site.name;
  frame.dataset.url = wazeUrl(site, zoom);
  frame.src = frame.dataset.url;
  frame.style.top = (-state.top) + "px";
  frame.style.width = "calc(100% + " + state.right + "px)";
  frame.style.height = "calc(100% + " + (state.top + state.bottom) + "px)";

  crop.appendChild(frame);
  pane.appendChild(crop);
  pane.appendChild(makeTag("Waze"));
  return pane;
}

function reloadWaze() {
  document.querySelectorAll("iframe.waze").forEach(function (f) {
    f.src = f.dataset.url;
  });
}

/* ---------------------------------------------------------------
   Google pane
---------------------------------------------------------------- */
let googleLoader = null;

function loadGoogle() {
  if (googleLoader) return googleLoader;
  googleLoader = new Promise(function (resolve, reject) {
    window.__gmReady = resolve;
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" +
            encodeURIComponent(GOOGLE_KEY) + "&callback=__gmReady";
    s.async = true;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return googleLoader;
}

function showGoogleMessage(box, text) {
  box.classList.add("empty");
  box.textContent = text;
}

function googlePane(site, zoom) {
  const pane = document.createElement("section");
  pane.className = "pane";

  const box = document.createElement("div");
  box.className = "gmap";
  pane.appendChild(box);
  pane.appendChild(makeTag("Google"));

  if (!GOOGLE_KEY) {
    showGoogleMessage(box, "The Google map needs an API key. Paste one into GOOGLE_KEY near the top of this file.");
    return pane;
  }

  window.gm_authFailure = function () {
    showGoogleMessage(box, "Google rejected the API key. Check that the key is valid, billing is on, and this website address is allowed.");
  };

  loadGoogle().then(function () {
    const map = new google.maps.Map(box, {
      center: { lat: site.lat, lng: site.lon },
      zoom: zoom,
      disableDefaultUI: true,
      gestureHandling: "none",
      keyboardShortcuts: false,
      clickableIcons: false
    });
    new google.maps.TrafficLayer({ autoRefresh: true }).setMap(map);
  }).catch(function () {
    showGoogleMessage(box, "Google Maps could not load. Check the internet connection and the API key.");
  });

  return pane;
}

/* ---------------------------------------------------------------
   Controls and rendering
---------------------------------------------------------------- */
const el = {
  site:   document.getElementById("site"),
  map:    document.getElementById("map"),
  zoomVal:document.getElementById("zoomVal"),
  zoomIn: document.getElementById("zoomIn"),
  zoomOut:document.getElementById("zoomOut"),
  top:    document.getElementById("top"),
  right:  document.getElementById("right"),
  link:   document.getElementById("tvLink"),
  copy:   document.getElementById("copy"),
  status: document.getElementById("status")
};

function currentZoom() {
  return state.zoom !== null ? state.zoom : SITES[state.site].zoom;
}

function tvLink() {
  const u = new URL(location.href);
  u.search = "";
  u.searchParams.set("site", state.site);
  u.searchParams.set("map", state.map);
  if (state.zoom !== null) u.searchParams.set("zoom", state.zoom);
  u.searchParams.set("top", state.top);
  if (state.right) u.searchParams.set("right", state.right);
  if (state.bottom) u.searchParams.set("bottom", state.bottom);
  u.searchParams.set("refresh", state.refresh);
  u.searchParams.set("kiosk", "1");
  return u.toString();
}

function syncControls() {
  el.site.value = state.site;
  el.map.value = state.map;
  el.zoomVal.textContent = currentZoom();
  el.top.value = state.top;
  el.right.value = state.right;
  el.link.value = tvLink();
}

function render() {
  if (timer) clearInterval(timer);

  const site = SITES[state.site];
  const zoom = currentZoom();

  stage.innerHTML = "";
  stage.dataset.cols = state.map === "both" ? "2" : "1";

  if (state.map !== "google") stage.appendChild(wazePane(site, zoom));
  if (state.map !== "waze")   stage.appendChild(googlePane(site, zoom));

  if (state.refresh > 0) timer = setInterval(reloadWaze, state.refresh * 60000);

  document.title = "Traffic test: " + site.name;
  syncControls();
}

el.site.addEventListener("change", function () {
  state.site = el.site.value;
  state.zoom = null;           // use the new location's default zoom
  render();
});
el.map.addEventListener("change", function () {
  state.map = el.map.value;
  render();
});
el.zoomIn.addEventListener("click", function () {
  state.zoom = Math.min(18, currentZoom() + 1);
  render();
});
el.zoomOut.addEventListener("click", function () {
  state.zoom = Math.max(3, currentZoom() - 1);
  render();
});
el.top.addEventListener("change", function () {
  state.top = Math.min(400, Math.max(0, Number(el.top.value) || 0));
  render();
});
el.right.addEventListener("change", function () {
  state.right = Math.min(400, Math.max(0, Number(el.right.value) || 0));
  render();
});
el.copy.addEventListener("click", function () {
  const text = tvLink();
  const done = function (msg) {
    el.status.textContent = msg;
    setTimeout(function () { el.status.textContent = ""; }, 2500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () { done("Link copied"); },
      function () { el.link.select(); done("Press Ctrl+C to copy"); }
    );
  } else {
    el.link.select();
    done("Press Ctrl+C to copy");
  }
});

render();
</script>
</body>
</html>
